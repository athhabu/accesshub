<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AccessHub Enterprise Portal</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-fixed-variant": "#653e00",
            "surface-bright": "#f8f9ff",
            "inverse-on-surface": "#eaf1ff",
            "surface-container-highest": "#d3e4fe",
            "secondary-container": "#6cf8bb",
            "on-secondary": "#ffffff",
            "on-secondary-fixed-variant": "#005236",
            "primary-container": "#4f46e5",
            "on-tertiary-container": "#ffd4a4",
            "on-primary-fixed-variant": "#3323cc",
            "secondary-fixed": "#6ffbbe",
            "error": "#ba1a1a",
            "on-tertiary": "#ffffff",
            "surface-container-high": "#dce9ff",
            "on-primary": "#ffffff",
            "error-container": "#ffdad6",
            "surface-container": "#e5eeff",
            "on-error": "#ffffff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#464555",
            "outline-variant": "#c7c4d8",
            "inverse-primary": "#c3c0ff",
            "on-primary-fixed": "#0f0069",
            "surface": "#f8f9ff",
            "tertiary-fixed-dim": "#ffb95f",
            "surface-tint": "#4d44e3",
            "tertiary-container": "#885500",
            "on-secondary-fixed": "#002113",
            "tertiary": "#684000",
            "surface-variant": "#d3e4fe",
            "tertiary-fixed": "#ffddb8",
            "on-error-container": "#93000a",
            "on-primary-container": "#dad7ff",
            "secondary": "#006c49",
            "surface-container-low": "#eff4ff",
            "primary-fixed-dim": "#c3c0ff",
            "primary": "#3525cd",
            "outline": "#777587",
            "secondary-fixed-dim": "#4edea3",
            "on-tertiary-fixed": "#2a1700",
            "primary-fixed": "#e2dfff",
            "background": "#f8f9ff",
            "inverse-surface": "#213145",
            "surface-container-lowest": "#ffffff",
            "on-secondary-container": "#00714d",
            "surface-dim": "#cbdbf5",
            "on-background": "#0b1c30"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "gutter": "1.5rem",
            "space-xl": "2rem",
            "space-lg": "1.5rem",
            "space-xs": "0.25rem",
            "margin-mobile": "1rem",
            "space-md": "1rem",
            "margin": "2rem",
            "gutter-mobile": "1rem",
            "space-sm": "0.5rem"
          },
          "fontFamily": {
            "label-sm": ["Inter", "sans-serif"],
            "headline-md": ["Inter", "sans-serif"],
            "title-md": ["Inter", "sans-serif"],
            "display-lg": ["Inter", "sans-serif"],
            "display-lg-mobile": ["Inter", "sans-serif"],
            "label-lg": ["Inter", "sans-serif"],
            "headline-lg-mobile": ["Inter", "sans-serif"],
            "headline-lg": ["Inter", "sans-serif"],
            "headline-sm": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "body-lg": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"]
          },
          "fontSize": {
            "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }],
            "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }],
            "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.025em", "fontWeight": "700" }],
            "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }],
            "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
            "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.005em", "fontWeight": "400" }],
            "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }],
            "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
            "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }]
          }
        }
      }
    };
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/custom.css"/>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen">
  <!-- SPA Main Mounting Point -->
  <div id="app" class="min-h-screen w-full"></div>

  <!-- Global Toast Notification Overlay -->
  <div id="global-toast" class="fixed bottom-6 right-6 z-50 transform translate-y-16 opacity-0 pointer-events-none flex items-center gap-2 px-4 py-3 bg-inverse-surface text-inverse-on-surface rounded-xl shadow-xl transition-all duration-300">
    <span class="material-symbols-outlined text-secondary-fixed text-[20px]" id="global-toast-icon">check_circle</span>
    <span class="font-body-sm text-body-sm font-medium" id="global-toast-text">Notification message</span>
  </div>

  <!-- Professional Security Assessment Achievement Banner (Juice Shop / PortSwigger Style) -->
  <div id="lab-solved-banner" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] transform -translate-y-36 opacity-0 pointer-events-none transition-all duration-500 ease-out max-w-xl w-[92%] sm:w-auto">
    <div class="flex items-center gap-4 px-5 py-3.5 bg-inverse-surface/95 backdrop-blur-md text-inverse-on-surface rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.35)] border border-secondary-fixed/30 ring-2 ring-secondary-fixed/20 relative overflow-hidden">
      <!-- Accent indicator bar -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-secondary-fixed via-emerald-400 to-secondary-fixed"></div>
      
      <!-- Icon badge -->
      <div class="w-11 h-11 rounded-xl bg-secondary-fixed/20 border border-secondary-fixed/40 flex items-center justify-center shrink-0 text-secondary-fixed">
        <span class="material-symbols-outlined text-[24px]">verified_user</span>
      </div>

      <!-- Text content -->
      <div class="flex-1 min-w-0 pr-2">
        <div class="flex items-center gap-2">
          <span class="font-label-sm text-[11px] font-bold tracking-wider text-secondary-fixed uppercase flex items-center gap-1">
            <span class="material-symbols-outlined text-[14px]">check</span>
            Vulnerability Verified
          </span>
          <span class="text-inverse-on-surface/40 text-[11px]">•</span>
          <span class="font-label-sm text-[11px] text-inverse-on-surface/70" id="lab-solved-assessment-tag">Access Control Assessment</span>
        </div>
        <h4 class="font-title-md text-title-md font-bold text-inverse-on-surface truncate mt-0.5" id="lab-solved-vuln-name">
          Vulnerability Name
        </h4>
        <p class="font-body-sm text-body-sm text-inverse-on-surface/80 truncate" id="lab-solved-check-title">
          Check Title
        </p>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center gap-2 shrink-0">
        <a href="#/lab-progress" class="h-8 px-3 rounded-lg bg-secondary-fixed hover:bg-secondary-fixed/90 text-on-secondary-fixed font-label-md text-label-md font-bold transition-all shadow-sm flex items-center gap-1.5 whitespace-nowrap">
          <span>View Progress</span>
          <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
        </a>
        <button type="button" onclick="State.hideLabSolvedBanner()" class="w-8 h-8 rounded-lg text-inverse-on-surface/60 hover:text-inverse-on-surface hover:bg-white/10 flex items-center justify-center transition-colors" title="Dismiss">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/state.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/header.js"></script>
  <script src="/js/views/login.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/profile.js"></script>
  <script src="/js/views/team.js"></script>
  <script src="/js/views/documents.js"></script>
  <script src="/js/views/orders.js"></script>
  <script src="/js/views/expenses.js"></script>
  <script src="/js/views/calendar.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/views/lab_progress.js"></script>
  <script src="/js/router.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AppRouter.init();
    });
  </script>
</body>
</html>
